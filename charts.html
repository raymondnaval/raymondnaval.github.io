<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      text-align: center;
    }

    .chart-container {
      width: 600px;
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<header>
	<img src="img/chartdemo/logo.png" />
</header>
<body>

   <h1>Data Demo</h1>

   <p id="tables">Simple chart example</p>

  <select id="labelSelect">
    <option value="semester">Semester</option>
    <option value="school">Nursing School</option>
  </select>

  <canvas id="myChart2"></canvas>

  <script>
    
    const dataSets = {
      semester: {
        labels: ['Spring 25', 'Summer 25', 'Fall 25', 'Spring 26', 'Summer 26'],
        data: [12, 19, 3, 5, 8]
      },
      school: {
        labels: ['APU', 'CSUSM', 'GCU', 'NU', 'PLNU', 'SDSU', 'USD', 'Other'],
        data: [45, 60, 38, 52, 120, 90, 100, 140]
      }
    };
    let label = document.getElementById('labelSelect').value;
    const ctx = document.getElementById('myChart2');

    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: dataSets.semester.labels,
        datasets: [{
          label: 'Total enrolled per ' + label,
          data: dataSets.semester.data,
          backgroundColor: 'rgba(54, 162, 235, 0.6)'
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    document.getElementById('labelSelect').addEventListener('change', (e) => {
      const selected = e.target.value;
      label = selected;
      chart.data.labels = dataSets[selected].labels;
      chart.data.datasets[0].data = dataSets[selected].data;

      chart.update();
    });


  </script>

</body>
</html>
